name: Reusable Validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Checkout Aspire shared source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: MALIEV-Co-Ltd/Maliev.Aspire
          ref: 6344320b4e8c11e55ebc78107308a80b74f498da
          path: shared/Maliev.Aspire
          persist-credentials: false

      - name: Checkout messaging contracts source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: MALIEV-Co-Ltd/Maliev.MessagingContracts
          ref: d633b24f9c02e4da2024bd164f1fb61acf6e6862
          path: shared/Maliev.MessagingContracts
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Maliev.CommerceService.slnx --configfile nuget.validation.config /p:SharedSourceRoot=../shared

      - name: Audit NuGet dependencies
        run: dotnet list Maliev.CommerceService.slnx package --vulnerable --include-transitive --no-restore

      - name: Build
        run: dotnet build Maliev.CommerceService.slnx --configuration Release --no-restore /p:SharedSourceRoot=../shared

      - name: Test
        run: dotnet test Maliev.CommerceService.slnx --configuration Release --no-restore --no-build --verbosity normal /p:SharedSourceRoot=../shared
